{{define "login.html"}}<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Трибуна — вход</title><style>body{font:16px system-ui;background:#101820;color:#edf2f4;display:grid;place-items:center;min-height:100vh;margin:0}main{width:min(420px,calc(100% - 32px));background:#192631;border:1px solid #2d3e4c;border-radius:14px;padding:28px;box-sizing:border-box}h1{margin-top:0}label{display:block;margin:14px 0 6px;color:#aebbc4}input{box-sizing:border-box;width:100%;padding:11px;border-radius:8px;border:1px solid #526473;background:#101820;color:#fff;font-size:16px}button{margin-top:22px;width:100%;padding:12px;border:0;border-radius:8px;background:#f25f3a;color:#fff;font-weight:700;font-size:16px}.error{color:#ff9f86;min-height:1.4em}</style></head><body><main><h1>Трибуна</h1><p>Рекламная админка</p><p class="error">{{.Error}}</p><form method="post" action="/admin/login"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Войти</button></form></main></body></html>{{end}}
